name: SonarQube Cloud Build-Based Scan

on:
  workflow_dispatch:

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check Java and Maven versions
        run: |
          echo "=== Java ==="
          java -version

          echo "=== Maven ==="
          ./mvnw --version

      - name: Build WebGoat
        run: |
          ./mvnw clean install \
            -DskipTests \
            -Dspotless.check.skip=true

      - name: Inspect compiled classes
        run: |
          echo "=== target/classes directories ==="
          find . -type d -path "*/target/classes" | sort

          echo
          echo "=== Number of compiled .class files ==="
          find . -type f -path "*/target/classes/*.class" | wc -l

          echo
          echo "=== Sample compiled classes ==="
          find . -type f -path "*/target/classes/*.class" | head -50 || true

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -DskipTests \
            -Dspotless.check.skip=true \
            -Dsonar.projectKey=appsec-bench_WebGoat-build \
            -Dsonar.projectName="WebGoat Build Based"
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.verbose=true
